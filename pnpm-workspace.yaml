packages:
  - "apps/*"
  - "packages/*"

# Fail the install when the running Node is outside `engines.node`, instead of
# only warning. `engines.pnpm` is enforced by pnpm by default; Node is not.
#
# The key is `engineStrict` -- the camelCase of .npmrc's `engine-strict`, which
# pnpm 11 no longer reads (.npmrc is auth/registry only now). `strictEngines`
# looks right but is silently ignored, so pnpm warns about the unknown key and
# lets a bad Node version through.
#
# `engines.bun` is validated by nothing -- not pnpm, not `bun run` -- so the
# Bun floor is asserted at boot by
# apps/backend/src/core/config/runtime.guard.ts instead.
engineStrict: true

# Single source of truth for versions shared across workspaces. Consumers
# declare `"typescript": "catalog:"` etc. Safe here because every package is
# private and never published.
catalog:
  # Exact, not ^: formatter output is version-sensitive, and a minor bump
  # silently reformatting the repo is not something a caret should permit.
  "@biomejs/biome": 2.5.11
  "@types/node": ^24.13.3
  "@vitest/coverage-v8": ^4.1.11
  typescript: ^6.0.3
  vitest: ^4.1.11
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  # Used by both packages/ui (the design system) and apps/web (the Vite
  # plugin). These two must never drift apart.
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  zod: ^4.4.3

allowBuilds:
  # Hooks are installed by the root `prepare` script instead.
  lefthook: false
  "@parcel/watcher": true
  "@swc/core": false
  esbuild: true
  unrs-resolver: true
