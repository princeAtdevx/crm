packages:
  - "apps/*"
  - "packages/*"

# Single source of truth for versions shared across workspaces. Consumers
# declare `"typescript": "catalog:"` etc. Safe here because every package is
# private and never published.
catalog:
  # Exact, not ^: formatter output is version-sensitive, and a minor bump
  # silently reformatting the repo is not something a caret should permit.
  "@biomejs/biome": 2.5.11
  "@types/node": ^24.13.3
  "@vitest/coverage-v8": ^4.1.11
  typescript: ^6.0.3
  vitest: ^4.1.11
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  # Used by both packages/ui (the design system) and apps/web (the Vite
  # plugin). These two must never drift apart.
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3

allowBuilds:
  # Hooks are installed by the root `prepare` script instead.
  lefthook: false
  "@parcel/watcher": true
  "@swc/core": false
  esbuild: true
  unrs-resolver: true
